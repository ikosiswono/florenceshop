<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f38"/>
      <stop offset="50%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713BDF"/>
      <stop offset="50%" stop-color="#00C8D7"/>
      <stop offset="100%" stop-color="#F5B942"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background with Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#shieldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Glowing Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Shield Crest -->
    <path d="M 0 -150 Q 110 -150 130 -80 C 130 50 70 140 0 180 C -70 140 -130 50 -130 -80 Q -110 -150 0 -150 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Central Minecraft Nether Star / Sword Motif -->
    <polygon points="0,-90 25,-25 90,0 25,25 0,90 -25,25 -90,0 -25,-25" fill="#F5B942"/>
    <circle cx="0" cy="0" r="18" fill="#00C8D7"/>
    
    <!-- Decorative Accents -->
    <circle cx="0" cy="-115" r="8" fill="#00C8D7"/>
    <circle cx="85" cy="-80" r="6" fill="#713BDF"/>
    <circle cx="-85" cy="-80" r="6" fill="#713BDF"/>
  </g>
  
  <!-- Subtle App Label -->
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="4">FLORENCE</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#F5B942" letter-spacing="6">MINECRAFT STORE</text>
</svg>
