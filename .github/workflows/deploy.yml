name: Validate & Deploy Storefront

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node --check script.js
          node --check sw.js

      - name: Build Static Output
        run: node build.js

      - name: Verify Core Web Files
        run: |
          test -f public/index.html || (echo "public/index.html missing!" && exit 1)
          test -f public/style.css || (echo "public/style.css missing!" && exit 1)
          test -f public/script.js || (echo "public/script.js missing!" && exit 1)
          test -f vercel.json || (echo "vercel.json missing!" && exit 1)
          test -f public/manifest.json || (echo "public/manifest.json missing!" && exit 1)
          test -f public/sw.js || (echo "public/sw.js missing!" && exit 1)
          test -f public/icon.svg || (echo "public/icon.svg missing!" && exit 1)
          echo "All core files and public output verified successfully!"
